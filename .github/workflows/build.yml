name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests
        run: go test -v -race ./...

  build:
    name: Cross-Compile Binary
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: windows
            goarch: amd64
            ext: ".exe"
            archive: zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          DIST_DIR="dist/huggingface-cli_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "$DIST_DIR"

          go build -trimpath \
            -ldflags="-s -w" \
            -o "${DIST_DIR}/huggingface-cli${{ matrix.ext }}" \
            ./cmd/huggingface-cli

          # Create hf symlink/copy for ease of use
          if [ "${{ matrix.goos }}" != "windows" ]; then
            (cd "$DIST_DIR" && ln -s "huggingface-cli${{ matrix.ext }}" "hf${{ matrix.ext }}")
          fi

          cp README.md LICENSE "$DIST_DIR/" 2>/dev/null || true

          # Create archive
          ARCHIVE_NAME="huggingface-cli_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p release-assets

          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && zip -r "../release-assets/${ARCHIVE_NAME}.zip" "huggingface-cli_${{ matrix.goos }}_${{ matrix.goarch }}")
          else
            tar -czvf "release-assets/${ARCHIVE_NAME}.tar.gz" -C dist "huggingface-cli_${{ matrix.goos }}_${{ matrix.goarch }}"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: huggingface-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release-assets/*
          retention-days: 14

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-assets
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd all-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            all-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
